<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Manrope', sans-serif;
            background-color: #0f0e12;
        }
        .aura-gradient {
            background: linear-gradient(135deg, #554d73 0%, #362f53 100%);
        }
        .primary-gradient {
            background: linear-gradient(135deg, #645889 0%, #584c7d 100%);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface": "#0f0e12",
                        "outline": "#77747e",
                        "secondary-fixed": "#e6dff9",
                        "on-background": "#e9e3ef",
                        "error": "#f97386",
                        "on-primary-container": "#e7dfff",
                        "primary-fixed-dim": "#c8beea",
                        "on-surface": "#e9e3ef",
                        "secondary": "#cac3dc",
                        "error-container": "#871c34",
                        "secondary-dim": "#bcb5ce",
                        "primary-dim": "#bcb3df",
                        "tertiary-container": "#fdcbf2",
                        "tertiary-dim": "#eebde3",
                        "surface-bright": "#2d2b34",
                        "surface-dim": "#0f0e12",
                        "on-error-container": "#ff97a3",
                        "surface-container-high": "#201f26",
                        "primary": "#cac1ed",
                        "surface-container-low": "#141318",
                        "on-primary": "#423b60",
                        "on-error": "#490013",
                        "surface-container": "#1a191f",
                        "on-surface-variant": "#aea9b5",
                        "inverse-on-surface": "#565459",
                        "background": "#0f0e12",
                        "tertiary-fixed-dim": "#eebde3",
                        "primary-container": "#554d73",
                        "surface-container-highest": "#27252d",
                        "outline-variant": "#494650",
                        "on-primary-fixed": "#362f53",
                        "on-secondary-container": "#c3bcd5",
                        "on-secondary-fixed": "#413d51",
                        "secondary-container": "#3d394d",
                        "inverse-surface": "#fdf8fe",
                        "surface-tint": "#cac1ed",
                        "on-secondary-fixed-variant": "#5d596e",
                        "primary-fixed": "#d6ccf9",
                        "on-primary-fixed-variant": "#534b71",
                        "on-secondary": "#423d52",
                        "on-tertiary": "#6f4969",
                        "surface-variant": "#27252d",
                        "on-tertiary-fixed": "#512e4c",
                        "error-dim": "#c44b5f",
                        "on-tertiary-container": "#654060",
                        "tertiary-fixed": "#fdcbf2",
                        "surface-container-lowest": "#000000",
                        "secondary-fixed-dim": "#d8d1ea",
                        "on-tertiary-fixed-variant": "#704a6a",
                        "inverse-primary": "#615a80",
                        "tertiary": "#ffdff6"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col">
<!-- Top Navigation -->
<header class="fixed top-0 w-full z-50 bg-surface/90 backdrop-blur-xl flex items-center justify-between px-6 py-5 border-b border-surface-container-high">
<div class="flex items-center gap-4">
<button class="p-2 rounded-full hover:bg-surface-container-high transition-colors active:scale-95 duration-150">
<span class="material-symbols-outlined text-primary" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-manrope text-lg font-semibold tracking-tight text-on-surface">Edit Profile</h1>
</div>
<div class="text-xl font-bold text-on-surface">Aura</div>
</header>
<!-- Content Canvas -->
<main class="flex-1 mt-20 px-6 max-w-2xl mx-auto w-full pb-32">
<!-- Hero Visual Section -->
<section class="flex flex-col items-center mb-10 pt-4">
<div class="relative group">
<div class="w-32 h-32 rounded-full bg-surface-container-highest flex items-center justify-center overflow-hidden border-4 border-surface-container-low transition-all duration-300 group-hover:scale-105 border-outline-variant/30">
<!-- Sample Profile Photo Placeholder -->
<img alt="Profile" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCF-Czrbxe_7fUPvbiFg3iVA27ILsn8m8GT8qr0Z3sXOTofxWuN4wPJVTtu5lTNsE2DvGkFfswM-iaaptRVTQhDYTbysOae64SNUMH_iosgDfJwZWsmh7X1T8FVSQvOo_CGABFAYf_ra4dtWuDvD-Af3RrpJ-gjyMGOjjfb7E7yyCxQjM39Cw7rb60BtbK6yeleK2KwO3FbySIGfiu9eDy-8BXwVDq2XjZAdhxCB9-4S7Dku3E1PL8zw-dQ-0-52GujO-inQbhWgHGX"/>
<div class="absolute inset-0 bg-primary/10 blur-xl -z-10"></div>
</div>
<button class="absolute bottom-0 right-0 p-3 primary-gradient rounded-full shadow-lg active:scale-90 transition-transform">
<span class="material-symbols-outlined text-white text-xl" data-icon="edit">edit</span>
</button>
</div>
<p class="mt-4 text-on-surface-variant text-sm font-medium">Update profile photo</p>
</section>
<!-- Form Layout -->
<div class="space-y-8">
<!-- Name Fields -->
<div class="grid grid-cols-2 gap-4">
<div class="space-y-3 relative">
<label class="block px-4 font-manrope text-xs font-bold text-on-surface-variant uppercase tracking-widest mb-2">First Name</label>
<div class="relative">
<input class="w-full bg-surface-container-highest border-0 rounded-full py-4 px-6 text-on-surface placeholder:text-outline-variant focus:ring-2 focus:ring-primary transition-all text-base pr-12" type="text" value="Julian"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-sm" data-icon="edit">edit</span>
</button>
</div>
</div>
<div class="space-y-3 relative">
<label class="block px-4 font-manrope text-xs font-bold text-on-surface-variant uppercase tracking-widest mb-2">Last Name</label>
<div class="relative">
<input class="w-full bg-surface-container-highest border-0 rounded-full py-4 px-6 text-on-surface placeholder:text-outline-variant focus:ring-2 focus:ring-primary transition-all text-base pr-12" type="text" value="Reed"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-sm" data-icon="edit">edit</span>
</button>
</div>
</div>
</div>
<!-- Headline Field -->
<div class="space-y-3 relative">
<label class="block px-4 font-manrope text-xs font-bold text-on-surface-variant uppercase tracking-widest mb-2">Headline</label>
<div class="relative">
<input class="w-full bg-surface-container-highest border-0 rounded-full py-4 px-6 text-on-surface placeholder:text-outline-variant focus:ring-2 focus:ring-primary transition-all text-base pr-12" placeholder="Digital Creator" type="text" value="Immersive Storyteller &amp; Product Designer"/>
<button class="absolute right-6 top-1/2 -translate-y-1/2 text-outline-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-sm" data-icon="edit">edit</span>
</button>
</div>
</div>
<!-- Bio Field -->
<div class="space-y-3 relative">
<div class="flex items-center justify-between px-4 mb-2">
<label class="font-manrope text-xs font-bold text-on-surface-variant uppercase tracking-widest">Bio</label>
</div>
<div class="relative">
<textarea class="w-full bg-surface-container-highest border-0 rounded-2xl text-on-surface placeholder:text-outline-variant focus:ring-2 focus:ring-primary transition-all resize-none leading-relaxed text-base px-8 py-6 pr-12" rows="4">Passionate about storytelling and tech. Building the future of digital interactions through immersive content. 5+ years experience in social media growth and creative direction.</textarea>
<button class="absolute right-6 top-6 text-outline-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-sm" data-icon="edit">edit</span>
</button>
</div>
<p class="px-4 text-on-surface-variant text-xs font-medium italic">Tell your story (max 200 characters)</p>
</div>
<!-- Phone Number -->
<div class="space-y-3 relative">
<label class="block px-4 font-manrope text-xs font-bold text-on-surface-variant uppercase tracking-widest mb-2">Phone Number</label>
<div class="relative">
<div class="flex items-center bg-surface-container-highest rounded-full px-6 py-4 group focus-within:ring-2 focus-within:ring-primary transition-all">
<span class="material-symbols-outlined text-on-surface-variant mr-3 group-focus-within:text-primary transition-colors" data-icon="call">call</span>
<input class="w-full bg-transparent border-0 p-0 text-on-surface placeholder:text-on-surface-variant focus:ring-0 text-base pr-8" placeholder="+1 (555) 000-0000" type="tel" value="+1 (555) 000-0000"/>
</div>
<button class="absolute right-6 top-1/2 -translate-y-1/2 text-outline-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-sm" data-icon="edit">edit</span>
</button>
</div>
</div>
<!-- Security Question -->
<div class="space-y-3 relative">
<label class="block px-4 font-manrope text-xs font-bold text-on-surface-variant uppercase tracking-widest mb-2">Security Question</label>
<div class="relative">
<div class="flex items-center bg-surface-container-highest rounded-full px-6 py-4 group focus-within:ring-2 focus-within:ring-primary transition-all appearance-none">
<select class="w-full bg-transparent border-0 p-0 text-on-surface focus:ring-0 text-base pr-12 appearance-none">
<option class="bg-surface">Select a security question</option>
<option class="bg-surface" selected="">What is your mother's maiden name?</option>
<option class="bg-surface">What was your first pet's name?</option>
<option class="bg-surface">In what city were you born?</option>
</select>
<span class="material-symbols-outlined absolute right-12 text-on-surface-variant pointer-events-none" data-icon="unfold_more">unfold_more</span>
</div>
<button class="absolute right-6 top-1/2 -translate-y-1/2 text-outline-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-sm" data-icon="edit">edit</span>
</button>
</div>
</div>
<!-- Security Answer -->
<div class="space-y-3 relative">
<label class="block px-4 font-manrope text-xs font-bold text-on-surface-variant uppercase tracking-widest mb-2">Security Answer</label>
<div class="relative">
<input class="w-full bg-surface-container-highest border-0 rounded-full py-4 px-6 text-on-surface placeholder:text-outline-variant focus:ring-2 focus:ring-primary transition-all text-base pr-12" placeholder="Your answer" type="text" value="Riverside"/>
<button class="absolute right-6 top-1/2 -translate-y-1/2 text-outline-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-sm" data-icon="edit">edit</span>
</button>
</div>
</div>
<!-- YouTube Field -->
<div class="space-y-3 relative">
<label class="block px-4 font-manrope text-xs font-bold text-on-surface-variant uppercase tracking-widest mb-2">YouTube</label>
<div class="relative">
<div class="flex items-center bg-surface-container-highest rounded-full px-6 py-4 group focus-within:ring-2 focus-within:ring-primary transition-all">
<span class="material-symbols-outlined text-on-surface-variant mr-3 group-focus-within:text-primary transition-colors" data-icon="play_circle">play_circle</span>
<input class="w-full bg-transparent border-0 p-0 text-on-surface placeholder:text-on-surface-variant focus:ring-0 text-base pr-8" placeholder="YouTube channel link" type="url" value="youtube.com/c/julianreed_creations"/>
</div>
<button class="absolute right-6 top-1/2 -translate-y-1/2 text-outline-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-sm" data-icon="edit">edit</span>
</button>
</div>
</div>
<!-- Password Field (Replaces Featured Videos) -->
<div class="space-y-3 relative">
<label class="block px-4 font-manrope text-xs font-bold text-on-surface-variant uppercase tracking-widest mb-2">Password</label>
<div class="relative">
<div class="flex items-center bg-surface-container-highest rounded-full px-6 py-4 group focus-within:ring-2 focus-within:ring-primary transition-all">
<span class="material-symbols-outlined text-on-surface-variant mr-3 group-focus-within:text-primary transition-colors" data-icon="lock">lock</span>
<input class="w-full bg-transparent border-0 p-0 text-on-surface placeholder:text-on-surface-variant focus:ring-0 text-base pr-8 tracking-widest" readonly="" type="password" value="••••••••"/>
</div>
<button class="absolute right-6 top-1/2 -translate-y-1/2 text-outline-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-sm" data-icon="edit">edit</span>
</button>
</div>
</div>
</div>
<!-- System Hint -->
<div class="mt-12 mb-8 text-center">
<p class="text-on-surface-variant text-[11px] uppercase font-bold tracking-[0.15em]">Updates are saved automatically to your draft</p>
</div>
<!-- Action Buttons -->
<div class="flex flex-col gap-4 mt-8 pb-12">
<!-- Primary Save Button -->
<button class="w-full primary-gradient text-white py-4 rounded-full flex items-center justify-center gap-2 font-manrope text-base font-bold shadow-2xl shadow-primary/30 active:scale-[0.98] transition-transform">
        Save Changes
    </button>
<!-- Secondary Delete Button -->
<button class="w-full py-4 text-error font-manrope text-sm font-bold bg-error/5 border border-error/20 hover:bg-error/10 transition-all active:scale-[0.98] duration-200 text-center rounded-full">
        Delete Profile
    </button>
</div>
</main>
<!-- Decorative Aura background -->
<div class="fixed top-1/4 -right-24 w-96 h-96 bg-primary/5 blur-[120px] rounded-full -z-20"></div>
<div class="fixed -bottom-24 -left-24 w-80 h-80 bg-tertiary/5 blur-[100px] rounded-full -z-20"></div>
</body></html>
